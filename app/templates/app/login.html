{% extends 'app/base.html' %}
{% block content %}
<div class="d-flex justify-content-center mt-5">
    <div class="card w-25 mt-5">
        <div class="card-header text-center alert alert-success h2">
          Connexion
        </div>
        <div class="card-body">
            <form action="{% url 'login' %}" method="post">
                {% csrf_token %}
                <div class="form-group">
                  <label for="exampleInputEmail1">Matricule</label>
                  <input type="username" class="form-control" name="username" id="id_username" required>
                </div>
                <div class="form-group mt-3">
                  <label for="exampleInputPassword1">Mot de passe</label>
                  <input type="password" class="form-control" name="password" id="id_password" required>
                </div>
                {% if msg%}
                <p class="text-danger"><small>{{msg}}</small></p>
                {% else %}
                <p>&nbsp;</p>
                {% endif %}
                <div class="d-flex justify-content-center mt-4 mb-1">
                  <button type="submit" class="btn btn-success btn-lg">Se connecter</button>
                </div>
                
              </form>
        </div>
    </div>
    
</div>

{% endblock content %}
